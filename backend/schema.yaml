openapi: 3.0.3
info:
  title: Langu-AI API
  version: 1.0.0
  description: API for the Langu-AI German language learning platform
paths:
  /api/v1/ai/{id}/save/:
    post:
      operationId: ai_save_create
      summary: Save AI content to user collection
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          description: No response body
  /api/v1/ai/content/{id}/:
    delete:
      operationId: ai_content_destroy
      summary: Delete a generated AI content entry
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ai/credit/:
    get:
      operationId: ai_credit_retrieve
      summary: Get user credit balance
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserCreditResponse'
          description: ''
  /api/v1/ai/generate/:
    post:
      operationId: ai_generate_create
      summary: Generate AI content for a learning item (cache-first)
      tags:
      - ai-content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIGenerateRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIGenerateRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIGenerateRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AIContent'
          description: ''
  /api/v1/ai/item-content/:
    post:
      operationId: ai_item_content_create
      summary: List all generated content for a learning item
      tags:
      - ai-content
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AIItemContentRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AIItemContentRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AIItemContentRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AIContent'
          description: ''
  /api/v1/ai/models/:
    get:
      operationId: ai_models_list
      summary: List active LLM models
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LLMModel'
          description: ''
  /api/v1/ai/saved/:
    get:
      operationId: ai_saved_list
      summary: List user's saved AI content
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedUserAIContentList'
          description: ''
  /api/v1/ai/saved/{id}/:
    delete:
      operationId: ai_saved_destroy
      summary: Remove AI content from user collection
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/ai/saved/{id}/share/:
    post:
      operationId: ai_saved_share_create
      summary: Generate share key for saved AI content
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareKeyResponse'
          description: ''
  /api/v1/ai/shared/{share_key}/:
    get:
      operationId: ai_shared_retrieve
      summary: View shared AI content by share key
      parameters:
      - in: path
        name: share_key
        schema:
          type: string
        required: true
      tags:
      - ai-content
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SharedAIContent'
          description: ''
  /api/v1/auth/change-password/:
    post:
      operationId: auth_change_password_create
      summary: Change password
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/forgot-password/:
    post:
      operationId: auth_forgot_password_create
      summary: Request password reset email
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      summary: Login or register with Google
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      summary: Login and receive auth token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      summary: Logout and invalidate token
      tags:
      - auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      summary: Get current user profile
      tags:
      - auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      summary: Update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      summary: Partially update current user profile
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_destroy
      summary: Delete current user account
      tags:
      - auth
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      summary: Register a new user
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/reset-password/:
    post:
      operationId: auth_reset_password_create
      summary: Reset password with token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/exercises/session/:
    get:
      operationId: exercises_session_list
      summary: Get an exercise session
      parameters:
      - in: query
        name: exercise_type
        schema:
          type: string
          enum:
          - flashcard
          - mcq_recognition
        description: Type of exercises to generate
        required: true
      - in: query
        name: max_items
        schema:
          type: integer
        description: Maximum exercises in session (default 20)
      tags:
      - exercises
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlashcardExercise'
          description: ''
  /api/v1/goals/:
    get:
      operationId: goals_list
      summary: List all learning goals
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - goals
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LearningGoal'
          description: ''
  /api/v1/levels/:
    get:
      operationId: levels_list
      summary: List all levels
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - levels
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLevelList'
          description: ''
    post:
      operationId: levels_create
      summary: Create a level (admin)
      tags:
      - levels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelWrite'
          description: ''
  /api/v1/levels/{code}/:
    get:
      operationId: levels_retrieve
      summary: Get a level by code
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[A-Za-z0-9.]+$
        required: true
      tags:
      - levels
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Level'
          description: ''
    put:
      operationId: levels_update
      summary: Update a level (admin)
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[A-Za-z0-9.]+$
        required: true
      tags:
      - levels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LevelWriteRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelWrite'
          description: ''
    patch:
      operationId: levels_partial_update
      summary: Partially update a level (admin)
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[A-Za-z0-9.]+$
        required: true
      tags:
      - levels
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedLevelWriteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedLevelWriteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedLevelWriteRequest'
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LevelWrite'
          description: ''
    delete:
      operationId: levels_destroy
      summary: Delete a level (admin)
      parameters:
      - in: path
        name: code
        schema:
          type: string
          pattern: ^[A-Za-z0-9.]+$
        required: true
      tags:
      - levels
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/memory/review/:
    post:
      operationId: memory_review_create
      summary: Submit a review result
      tags:
      - memory
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ReviewRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ReviewRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewResponse'
          description: ''
  /api/v1/memory/session/:
    get:
      operationId: memory_session_list
      summary: Get a practice session
      parameters:
      - in: query
        name: max_items
        schema:
          type: integer
        description: Maximum items in session (default 20)
      - in: query
        name: skill_type
        schema:
          type: string
        description: Skill type filter (recognition, production, listening, spelling)
      tags:
      - memory
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SessionItem'
          description: ''
  /api/v1/onboarding/:
    get:
      operationId: onboarding_retrieve
      summary: Get onboarding status
      tags:
      - onboarding
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
          description: ''
    post:
      operationId: onboarding_create
      summary: Complete onboarding
      tags:
      - onboarding
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingCompleteRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/OnboardingCompleteRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingCompleteRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingStatus'
          description: ''
  /api/v1/packs/:
    get:
      operationId: packs_list
      summary: List available packs
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - packs
      security:
      - cookieAuth: []
      - tokenAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPackList'
          description: ''
  /api/v1/packs/{pack_id}/archive/:
    post:
      operationId: packs_archive_create
      summary: Archive a pack subscription
      parameters:
      - in: path
        name: pack_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - packs
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPackSubscription'
          description: ''
  /api/v1/packs/{pack_id}/unarchive/:
    post:
      operationId: packs_unarchive_create
      summary: Unarchive a pack subscription
      parameters:
      - in: path
        name: pack_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - packs
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPackSubscription'
          description: ''
  /api/v1/packs/{pack_id}/unsubscribe/:
    delete:
      operationId: packs_unsubscribe_destroy
      summary: Unsubscribe from a pack
      parameters:
      - in: path
        name: pack_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - packs
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/packs/subscribe/:
    post:
      operationId: packs_subscribe_create
      summary: Subscribe to a pack
      tags:
      - packs
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SubscribeRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubscribeRequestRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPackSubscription'
          description: ''
  /api/v1/packs/subscriptions/:
    get:
      operationId: packs_subscriptions_list
      summary: List user's pack subscriptions
      parameters:
      - in: query
        name: status
        schema:
          type: string
          enum:
          - active
          - archived
          - completed
      tags:
      - packs
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserPackSubscription'
          description: ''
  /api/v1/progress/:
    get:
      operationId: progress_list
      summary: List user progress
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - progress
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSectionProgressList'
          description: ''
    post:
      operationId: progress_create
      summary: Create/update section progress
      tags:
      - progress
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SectionProgressRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SectionProgressRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SectionProgressRequest'
        required: true
      security:
      - cookieAuth: []
      - tokenAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
