components:
  schemas:
    AIContent:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          readOnly: true
        level_code:
          type: string
          readOnly: true
        category:
          type: string
          readOnly: true
        section_title:
          type: string
          readOnly: true
        item_cells:
          type: array
          items:
            type: string
          readOnly: true
        section_headers:
          type: array
          items:
            type: string
          readOnly: true
        response_text:
          type: string
          readOnly: true
        response_json:
          readOnly: true
        model_used:
          type: string
          readOnly: true
        is_saved:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action_type
      - category
      - created_at
      - id
      - is_saved
      - item_cells
      - level_code
      - model_used
      - response_json
      - response_text
      - section_headers
      - section_title
    AIGenerateRequestRequest:
      type: object
      properties:
        level_code:
          type: string
          minLength: 1
          maxLength: 10
        category:
          $ref: '#/components/schemas/CategoryEnum'
        section_title:
          type: string
          minLength: 1
          maxLength: 255
        section_headers:
          type: array
          items:
            type: string
            minLength: 1
        item_cells:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
        action_type:
          $ref: '#/components/schemas/ActionTypeEnum'
        model:
          type: string
          minLength: 1
          maxLength: 100
        save_as_default:
          type: boolean
          default: false
        regenerate:
          type: boolean
          default: false
      required:
      - action_type
      - category
      - item_cells
      - level_code
      - section_title
    AIItemContentRequestRequest:
      type: object
      properties:
        level_code:
          type: string
          minLength: 1
          maxLength: 10
        category:
          type: string
          minLength: 1
          maxLength: 20
        section_title:
          type: string
          minLength: 1
          maxLength: 255
        item_cells:
          type: array
          items:
            type: string
            minLength: 1
          minItems: 1
      required:
      - category
      - item_cells
      - level_code
      - section_title
    ActionTypeEnum:
      enum:
      - examples
      - quiz
      - explanation
      type: string
      description: |-
        * `examples` - More Examples
        * `quiz` - Quiz / Question
        * `explanation` - Explanation
    AuthResponse:
      type: object
      properties:
        user:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        token:
          type: string
      required:
      - token
      - user
    CategoryEnum:
      enum:
      - grammar
      - vocab
      - verbs
      - phrases
      type: string
      description: |-
        * `grammar` - Grammatik
        * `vocab` - Wortschatz
        * `verbs` - Verben
        * `phrases` - Phrasen
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
          writeOnly: true
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - new_password
      - old_password
    ContentTypeEnum:
      enum:
      - table
      - notes
      - grid
      type: string
      description: |-
        * `table` - Table
        * `notes` - Notes
        * `grid` - Grid
    FlashcardExercise:
      type: object
      properties:
        exercise_type:
          type: string
        item_id:
          type: string
        skill_type:
          type: string
        is_new:
          type: boolean
        front_text:
          type: string
        front_hint:
          type: string
        back_text:
          type: string
        back_extra:
          type: string
      required:
      - back_extra
      - back_text
      - exercise_type
      - front_hint
      - front_text
      - is_new
      - item_id
      - skill_type
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    GoogleLoginRequest:
      type: object
      properties:
        credential:
          type: string
          minLength: 1
      required:
      - credential
    LLMModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        model_id:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        is_default:
          type: boolean
          readOnly: true
        approx_cost_eur:
          type: number
          format: double
          readOnly: true
      required:
      - approx_cost_eur
      - id
      - is_default
      - model_id
      - name
      - provider
    LearningGoal:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          readOnly: true
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          readOnly: true
        icon:
          type: string
          readOnly: true
        order:
          type: integer
          readOnly: true
      required:
      - description
      - icon
      - id
      - name
      - order
      - slug
    Level:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        section_count:
          type: integer
          readOnly: true
      required:
      - code
      - id
      - name
      - section_count
    LevelWrite:
      type: object
      properties:
        code:
          type: string
          maxLength: 10
        name:
          type: string
          maxLength: 100
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - code
      - name
    LevelWriteRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 10
        name:
          type: string
          minLength: 1
          maxLength: 100
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - code
      - name
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    OnboardingCompleteRequest:
